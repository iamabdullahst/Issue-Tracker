name: Test API and web

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test IssueTracker.Tests/IssueTracker.Tests.csproj --configuration Release

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        working-directory: issue-tracker-web
      - run: npm run lint
        working-directory: issue-tracker-web
      - run: npm run build
        working-directory: issue-tracker-web